name: Supersolid
description: 'Supersolid is a London, UK based mobile game developer and publisher, backed by Index
  Ventures, that designs and operates free-to-play mobile titles across merge, cooking, simulation,
  and multiplayer arena genres. Its portfolio includes Cook & Merge, Snake Rivals, Home Street, Food
  Street, Adventure Town, Super Penguins, and RoPets. Supersolid is a consumer-facing games studio and
  does not publish a public developer API, SDK, or developer portal; this API Evangelist profile captures
  its public web properties (support, careers, terms, privacy) and domain-security posture. It was
  surfaced as a portfolio company of Index Ventures.'
